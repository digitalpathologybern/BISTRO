# ============================================================================
# BISTRO -- Python environment
# ----------------------------------------------------------------------------
# The direct Python dependencies of the pipeline, pinned to the versions the
# manuscript results were produced with.
#
#     conda env create -n bistro -f envs/environment.yml
#     conda activate bistro
#
# This file is curated, not machine-generated. It documents the packages
# BISTRO imports directly. It is NOT the install path: with pandas held at
# 2.0.0 this set cannot be resolved by pip (see the note on pandas below), so
# installation goes through requirements-lock.txt with --no-deps.
#
# The same split is used for R: install_R_packages.R installs the direct
# dependencies, R_packages.csv records the full environment.
#
# ---- Why almost everything is under `pip:` ---------------------------------
# This mirrors how the manuscript environment was actually built: only python,
# setuptools and numpy came from conda; every other package came from PyPI.
# The distinction is not cosmetic -- conda-forge and PyPI carry different build
# matrices for the same version, and sourcing these from conda-forge does not
# work:
#
#   * xarray 2024.11.0 has no conda-forge build for Python 3.11 (3.12+ only),
#     so pinning it as a conda package is unsatisfiable against python=3.11.8.
#   * matplotlib 3.9.0 has been withdrawn from conda-forge's repodata, which
#     now starts at 3.9.1, while PyPI still serves 3.9.0.
#
# Every version is pinned. A floating package resolves to whatever is current,
# and a 2026-era xarray demands a far newer pandas than the 2.0.0 this pipeline
# was tested against; pip reports that as a conflict between pandas and
# spatialdata, naming neither xarray nor the real cause.
# ============================================================================

name: bistro

channels:
  - conda-forge

dependencies:
  # ---- Interpreter --------------------------------------------------------
  - python=3.11.8
  - pip
  # spatialdata 0.2.6 imports pkg_resources, which modern Python no longer
  # ships; without setuptools its import fails with ModuleNotFoundError.
  - setuptools=69.1.0
  # From conda-forge so it links against conda-forge's OpenBLAS, as in the
  # manuscript environment. Repeated under pip: below so pip treats it as
  # satisfied rather than replacing it with a PyPI wheel.
  - numpy=1.26.4

  - pip:
      # ---- Numerical core ---------------------------------------------------
      - numpy==1.26.4
      # Held at the version every published result was computed on. This set
      # is deliberately NOT pip-resolvable: spatialdata 0.2.6 requires
      # xarray>=2024.10.0, and every such xarray requires pandas>=2.1. Install
      # via requirements-lock.txt with --no-deps, which is what the recorded
      # environment actually is.
      - pandas==2.0.0
      - scipy==1.13.1
      - scikit-learn==1.5.0
      - statsmodels==0.14.2

      # ---- Plotting ---------------------------------------------------------
      - matplotlib==3.9.0
      - seaborn==0.13.2

      # ---- Geometry ---------------------------------------------------------
      # GeoJSON tissue annotations and point-in-polygon assignment.
      - geopandas==1.0.0
      - shapely==2.0.4

      # ---- Graph / clustering -----------------------------------------------
      # Leiden clustering in the HVG benchmark.
      - python-igraph==0.11.8
      - leidenalg==0.10.2

      # ---- Array / IO -------------------------------------------------------
      - zarr==2.15.0
      - dask==2024.11.2
      - xarray==2024.11.0
      - pyarrow==16.1.0
      # A real dependency of anndata/scanpy. Listed explicitly because pip
      # treats anything visible in the builder's ~/.local as already satisfied
      # and omits it, which makes the environment depend on who built it.
      - natsort==8.4.0
      - tqdm==4.66.4

      # ---- scverse stack ----------------------------------------------------
      - anndata==0.10.8
      - scanpy==1.10.2
      - spatialdata==0.2.6

      # ---- Plotting helpers -------------------------------------------------
      - upsetplot==0.9.0

      # ---- Pinned transitive dependencies -----------------------------------
      # Not imported by BISTRO directly, but pinned because leaving them to the
      # resolver breaks the pinned packages above. These are the versions that
      # coexisted in the manuscript environment, so they are known mutually
      # consistent.
      #
      # numcodecs is the clearest example: the current release removed
      # `cbuffer_sizes` from numcodecs.blosc, which zarr 2.15.0 imports, so an
      # unpinned numcodecs makes both zarr and spatialdata fail to import --
      # with an error that mentions neither.
      - numcodecs==0.12.1
      - fsspec==2023.6.0
      - ome-zarr==0.9.0
      - multiscale-spatial-image==2.0.2
      - spatial-image==1.1.0
      - dask-image==2023.8.1
      - xarray-schema==0.0.3
      - xarray-spatial==0.4.0
      - numba==0.61.0
      - scikit-image==0.24.0
      - networkx==3.1
